<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>新規ユーザー登録</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:#fafafa; margin:0; padding:0;
    }
    .card {
      max-width: 520px; margin: 40px auto; background:white;
      border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08); padding:24px;
    }
    .title { font-weight: 700; margin-bottom: 16px; font-size:1.3em; }

    .alert {
      border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
      font-weight:600;
    }
    .alert.error { background: #fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
    .alert.success { background: #dcfce7; color:#166534; border:1px solid #86efac; }

    label { display:block; font-weight:600; margin:14px 0 6px; }
    .req { display:inline-block; margin-left:.5em; padding:.1em .5em;
      font-size:.8em; background:#ffebe6; color:#e5533d; border-radius:6px;
    }

    input[type="text"], input[type="password"], input[type="email"] {
      width:100%; box-sizing:border-box; padding:14px 16px;
      border:1px solid #e4e4e7; border-radius:999px; background:#f3f4f6;
      outline:none;
    }
    input[type="file"] { margin-top:6px; }

    .hint { font-size:.9em; color:#6b7280; margin-top:4px; }
    .actions { display:flex; justify-content:flex-end; gap:12px; margin-top:22px; }
    .btn {
      border:none; border-radius:999px; padding:12px 20px; cursor:pointer; font-weight:600;
      background:#f3f4f6; transition:0.15s;
    }
    .btn:hover { background:#e5e7eb; }
    .btn.primary { background:#f59e0b; color:white; }
    .btn.primary:hover { background:#d97706; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">新規ユーザー登録</div>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}
    {% if message %}
      <div class="alert success">{{ message }}</div>
    {% endif %}

    <form action="{{ url_for('register_user') }}" method="post" enctype="multipart/form-data">

      <label for="name">ユーザー名 <span class="req">必須</span></label>
      <input type="text" id="name" name="name" placeholder="例）山田 太郎" required>

      <label for="email">メールアドレス <span class="req">必須</span></label>
      <input type="email" id="email" name="email" placeholder="例）go_player@example.com" required>
      <div class="hint">ログインや通知に使用されます。</div>

      <label for="password">パスワード <span class="req">必須</span></label>
      <input type="password" id="password" name="password" required>

      <label for="profile_image">プロフィール画像</label>
      <input type="file" id="profile_image" name="profile_image" accept="image/*">
      <div class="hint">2MB以下の画像を選択してください。</div>

      <div class="actions">
        <button type="reset" class="btn">リセット</button>
        <button type="submit" class="btn primary">登録する</button>
      </div>
    </form>
  </div>
</body>
</html>
