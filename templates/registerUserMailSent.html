<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ユーザー登録メール送信完了</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #fafafa; /* 登録画面と統一 */
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: #ffe6cc; 
      border: 1px solid #ffb570;
      border-radius: 10px;
      padding: 24px 32px;
      max-width: 440px;
      text-align: left;
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
      color: #333;
      line-height: 1.6;
    }
    .message {
      font-size: 1rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="message">
      入力されたメールアドレス宛に本登録メールを送りました。<br>
      メールのURLにアクセスして登録を完了させてください。
    </div>
  </div>
</body>
</html>
