<!DOCTYPE html>
<html>
<head>
    <title>トップページ</title>
</head>
<body>
    <h1>トップページ</h1>

    {% if message %}
      <p>{{ message }}</p>
    {% endif %}

    {% if user_email %}
        <p>{{ user_email }} さん、ログイン中です。</p>

        <form action="/logout" method="post">
            <button type="submit">ログアウト</button>
        </form>

    {% else %}
        <p>ログインしてください。</p>

        <!-- ログインページへのリンク -->
        <a href="/login">ログインページへ</a>
    {% endif %}
</body>
</html>
