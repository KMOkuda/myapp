<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ログイン</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background:#fafafa; margin:0; padding:0;
    }
    .card {
      max-width: 520px; margin: 40px auto; background:white;
      border-radius:16px; box-shadow:0 6px 24px rgba(0,0,0,.08); padding:24px;
    }
    .title { font-weight: 700; margin-bottom: 16px; font-size:1.3em; }
    .alert {
      border-radius: 10px; padding: 12px 16px; margin-bottom: 20px;
      font-weight:600;
    }
    .alert.error { background: #fee2e2; color:#b91c1c; border:1px solid #fca5a5; }
    .alert.success { background: #dcfce7; color:#166534; border:1px solid #86efac; }

    label { display:block; font-weight:600; margin:14px 0 6px; }

    input[type="email"], input[type="password"] {
      width:100%; box-sizing:border-box; padding:14px 16px;
      border:1px solid #e4e4e7; border-radius:999px; background:#f3f4f6;
      outline:none;
    }

    .btn {
      width:100%;                /* 入力欄と同じ幅 */
      border:none; border-radius:999px; padding:14px 16px; cursor:pointer; 
      font-weight:600; margin-top:22px;
      background:#f59e0b; color:white; transition:0.15s; text-align:center;
    }
    .btn:hover { background:#d97706; }

    hr {
      border:0;
      border-top:1px solid #e5e7eb;
      margin:24px 0;
    }

    .register-link {
      display:block; text-align:center; font-size:0.9em;
      color:#f59e0b; font-weight:600; text-decoration:none;
    }
    .register-link:hover { color:#d97706; text-decoration:underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">ログイン</div>

    {% if error %}
      <div class="alert error">{{ error }}</div>
    {% endif %}
    {% if message %}
      <div class="alert success">{{ message }}</div>
    {% endif %}

    <form action="/login" method="post">

      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email"
             placeholder="例）go_player@example.com" value="{{ email or '' }}" required>

      <label for="password">パスワード</label>
      <input type="password" id="password" name="password" required>

      <button type="submit" class="btn">ログイン</button>
    </form>

    <hr>
    <a href="/registerUser" class="register-link">新規登録はこちら</a>
  </div>
</body>
</html>
